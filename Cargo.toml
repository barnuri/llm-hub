[package]
name = "llm-hub"
version = "0.1.0"
edition = "2024"

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

# CI runs clippy with -D warnings, so every lint below fails the build. clippy.toml allows
# unwrap, expect, panic and dbg in tests.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
expect_used = "warn"
mod_module_files = "warn"
panic = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[dependencies]
arc-swap = "1.9.2"
axum = "0.8.9"
bytes = "1.12.1"
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures-util = "0.3.34"
hdrhistogram = "7.6.0"
keyring = "4.2.0"
mime_guess = "2.0.5"
rand = "0.10.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.2.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
shlex = "2.0.1"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Unwind, so the hub can catch a panicking extension and keep serving.
panic = "unwind"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
