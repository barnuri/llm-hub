name: Bug report
description: A request that llm-hub handles wrong, or a crash.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you sent, what llm-hub returned, and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Client (Claude Code, Codex, opencode, curl), endpoint (/v1/messages, /v1/responses, /v1/chat/completions), model and the smallest request that fails.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: llm-hub version
      description: Output of `llm-hub --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
  - type: textarea
    id: logs
    attributes:
      label: Logs or error body
      description: Remove tokens, hosts and personal data first.
      render: text
