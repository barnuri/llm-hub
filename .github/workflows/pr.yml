name: pr

on:
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  DIFF_COVERAGE_MIN: 80

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          has() { echo "$changed" | grep -qE "$1" && echo true || echo false; }
          echo "rust=$(has '^(src/|tests/|ui/|docs/openapi.json|build.rs|Cargo\.(toml|lock)|rust-toolchain.toml|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "ui=$(has '^(ui-src/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # Runs the Linux tests once, with coverage, and fails when the changed lines are under-tested.
  coverage:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo llvm-cov --all-targets --lcov --output-path lcov.info
      - name: Diff coverage
        if: github.event_name == 'pull_request'
        run: |
          pipx run diff-cover==11.0.3 lcov.info \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under="$DIFF_COVERAGE_MIN" \
            --markdown-report diff-coverage.md
      - name: Coverage summary
        if: always() && github.event_name == 'pull_request'
        run: |
          echo "Changed Rust lines must be at least $DIFF_COVERAGE_MIN% covered." >> "$GITHUB_STEP_SUMMARY"
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  test-windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-windows
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test --all-targets

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-src/package-lock.json
      - run: npm --prefix ui-src ci && npm --prefix ui-src run build

  # The one check the master ruleset requires. A skipped job counts as passed.
  pr-ok:
    if: always()
    needs: [changes, lint, coverage, test-windows, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "a required job ended as $result"
              exit 1
            fi
          done
