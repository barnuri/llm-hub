name: pr

on:
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  COVERAGE_MIN: 80
  CARGO_LLVM_COV_VERSION: 0.9.1

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          has() { echo "$changed" | grep -qE "$1" && echo true || echo false; }
          echo "rust=$(has '^(src/|tests/|ui/|docs/openapi.json|build.rs|Cargo\.(toml|lock)|rust-toolchain.toml|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "ui=$(has '^(ui-src/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-lint-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - if: github.ref == 'refs/heads/master' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo clean -p llm-hub
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/master' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  coverage:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: rustup component add llvm-tools-preview
      - id: llvm-cov
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ env.CARGO_LLVM_COV_VERSION }}
      - if: steps.llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"
      - id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-coverage-${{ runner.os }}-
      - name: Tests with coverage
        run: cargo llvm-cov --all-targets --json --summary-only --fail-under-lines "$COVERAGE_MIN" --output-path target/coverage.json
      - name: Every file meets the minimum
        run: |
          jq -r --argjson min "$COVERAGE_MIN" --arg src "$PWD/src/" '
            .data[0].files[]
            | select((.filename | startswith($src)) and .summary.lines.percent < $min)
            | "\(.summary.lines.percent | floor)% \(.filename | ltrimstr($src))"' target/coverage.json > target/below.txt
          if [ -s target/below.txt ]; then
            echo "Files under $COVERAGE_MIN% line coverage:"
            cat target/below.txt
            exit 1
          fi
      - name: Coverage summary
        if: always()
        run: |
          jq -r '"Total line coverage: \(.data[0].totals.lines.percent | floor)%"' target/coverage.json >> "$GITHUB_STEP_SUMMARY" || true
          sed 's/^/- under minimum: /' target/below.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - if: github.ref == 'refs/heads/master' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo clean -p llm-hub
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/master' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  test-windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-test-${{ runner.os }}-
      - run: cargo test --all-targets
      - if: github.ref == 'refs/heads/master' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo clean -p llm-hub
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/master' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-src/package-lock.json
      - run: npm --prefix ui-src ci && npm --prefix ui-src run build

  # The one check the master ruleset requires.
  pr-ok:
    if: always()
    needs: [changes, lint, coverage, test-windows, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "a required job ended as $result"
              exit 1
            fi
          done
