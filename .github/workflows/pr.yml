name: pr

on:
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  COVERAGE_MIN: 80
  CARGO_LLVM_COV_VERSION: 0.9.1

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          has() { echo "$changed" | grep -qE "$1" && echo true || echo false; }
          echo "rust=$(has '^(src/|tests/|ui/|docs/openapi.json|build.rs|Cargo\.(toml|lock)|rust-toolchain.toml|clippy.toml|scripts/check.sh|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "ui=$(has '^(ui-src/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
          shared-key: lint
          cache-on-failure: true
      - run: scripts/check.sh fast

  coverage:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }},nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
          shared-key: coverage
          cache-on-failure: true
      - name: Tests with the coverage gate
        run: scripts/check.sh coverage
      - name: Coverage summary
        if: always()
        run: |
          jq -r '"Total line coverage: \(.data[0].totals.lines.percent | floor)%"' target/coverage.json >> "$GITHUB_STEP_SUMMARY" || true

  test-windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
          shared-key: test-windows
          cache-on-failure: true
      - run: cargo nextest run --all-targets --no-fail-fast

  test-macos:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
          shared-key: test-macos
          cache-on-failure: true
      - run: cargo nextest run --all-targets --no-fail-fast

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-src/package-lock.json
      - run: npm --prefix ui-src ci && npm --prefix ui-src run build

  # The one check the master ruleset requires.
  pr-ok:
    if: always()
    needs: [changes, lint, coverage, test-windows, test-macos, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "a required job ended as $result"
              exit 1
            fi
          done
