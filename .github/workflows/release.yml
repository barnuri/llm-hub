name: release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/pr.yml

  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute version (Cargo.toml patch = run number)
        id: version
        run: |
          base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2 | cut -d. -f1-2)
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: llm-hub-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: llm-hub-linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            asset: llm-hub-macos-x86_64
          # Cross-compiled on the Intel runner: hosted macOS arm64 runners often have no capacity.
          - target: aarch64-apple-darwin
            runner: macos-15-intel
            asset: llm-hub-macos-aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: llm-hub-windows-x86_64.exe
            exe: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-src/package-lock.json
      - run: npm --prefix ui-src ci && npm --prefix ui-src run build
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-release-${{ matrix.target }}-
      # Windows perl refuses to edit in place without a backup suffix.
      - name: Stamp version
        run: |
          perl -pi.bak -e '$done ||= s/^version = ".*"/version = "${{ needs.tag.outputs.version }}"/' Cargo.toml
          grep '^version' Cargo.toml
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/llm-hub${{ matrix.exe }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  build-mistralrs:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: llm-hub-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: llm-hub-linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            asset: llm-hub-macos-x86_64
          # Cross-compiled on the Intel runner: hosted macOS arm64 runners often have no capacity.
          - target: aarch64-apple-darwin
            runner: macos-15-intel
            asset: llm-hub-macos-aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: llm-hub-windows-x86_64.exe
            exe: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev cmake
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-src/package-lock.json
      - run: npm --prefix ui-src ci && npm --prefix ui-src run build
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-mistralrs-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-release-mistralrs-${{ matrix.target }}-
      - name: Stamp version
        run: |
          perl -pi.bak -e '$done ||= s/^version = ".*"/version = "${{ needs.tag.outputs.version }}"/' Cargo.toml
          grep '^version' Cargo.toml
      - run: cargo build --release --target ${{ matrix.target }} --features mistralrs
      - run: cp target/${{ matrix.target }}/release/llm-hub${{ matrix.exe }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: mistralrs-${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [test, tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: 'llm-hub-*'
          path: assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.tag.outputs.version }}
        run: >
          gh release create "$TAG" assets/*
          --repo "${{ github.repository }}" --target "${{ github.sha }}"
          --title "$TAG" --generate-notes

  release-mistralrs:
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.tag.result == 'success' }}
    needs: [test, tag, build-mistralrs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: 'mistralrs-*'
          path: assets
          merge-multiple: true
      - name: Require at least one mistral.rs asset
        run: |
          shopt -s nullglob
          assets=(assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No mistral.rs platform artifacts succeeded; refusing to publish an empty release"
            exit 1
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.tag.outputs.version }}-mistralrs
        run: >
          gh release create "$TAG" assets/*
          --repo "${{ github.repository }}" --target "${{ github.sha }}"
          --title "$TAG" --prerelease
          --notes "mistral.rs build of v${{ needs.tag.outputs.version }}. macOS builds use Metal; Linux and Windows builds are CPU-only. Updated by binaries built with the mistralrs feature."
