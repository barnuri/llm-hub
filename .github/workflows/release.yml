name: release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/pr.yml

  tag:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute version (Cargo.toml patch = run number)
        id: version
        run: |
          base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2 | cut -d. -f1-2)
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: llm-hub-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: llm-hub-linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            asset: llm-hub-macos-x86_64
          # Cross-compiled on the Intel runner: hosted macOS arm64 runners often have no capacity.
          - target: aarch64-apple-darwin
            runner: macos-15-intel
            asset: llm-hub-macos-aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: llm-hub-windows-x86_64.exe
            exe: .exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-src/package-lock.json
      - run: npm --prefix ui-src ci && npm --prefix ui-src run build
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-release-${{ matrix.target }}-
      # Windows perl refuses to edit in place without a backup suffix.
      - name: Stamp version
        run: |
          perl -pi.bak -e '$done ||= s/^version = ".*"/version = "${{ needs.tag.outputs.version }}"/' Cargo.toml
          grep '^version' Cargo.toml
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/llm-hub${{ matrix.exe }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.tag.outputs.version }}
        run: >
          gh release create "$TAG" assets/*
          --repo "${{ github.repository }}" --target "${{ github.sha }}"
          --title "$TAG" --generate-notes
